name: "Bug report"
description: "Report a reproducible problem with Resonant Arcana."
title: "[Bug]: "
labels:
  - "bug"
  - "needs-triage"
body:
  -
    type: "markdown"
    attributes:
      value: "Report problems with **Resonant Arcana** here. Check the [README](https://github.com/Mikaaah/Resonant-Arcana#readme) and existing reports first. Use the feature form for new ideas."
  -
    type: "checkboxes"
    id: "checks"
    attributes:
      label: "Before submitting"
      options:
        -
          label: "I searched existing issues and checked the project README."
          required: true
        -
          label: "I removed tokens, passwords, personal data and private server details from my report and attachments."
          required: true
  -
    type: "dropdown"
    id: "area"
    attributes:
      label: "Affected area"
      options:
        - "Startup / crash"
        - "Wands / controls"
        - "Casting / spells"
        - "Combat / balance"
        - "Visuals / audio"
        - "Multiplayer / compatibility"
        - "Configuration"
        - "Documentation"
        - "Other"
    validations:
      required: true
  -
    type: "textarea"
    id: "versions"
    attributes:
      label: "Versions and environment"
      description: "Resonant Arcana, Minecraft, NeoForge and Iron's Spells versions; optional mods such as AAAParticles; client or dedicated server."
    validations:
      required: true
  -
    type: "textarea"
    id: "behavior"
    attributes:
      label: "Expected and actual behavior"
      description: "Describe what you expected and what happened."
    validations:
      required: true
  -
    type: "textarea"
    id: "reproduce"
    attributes:
      label: "Steps to reproduce"
      description: "Give numbered steps and a minimal example where possible."
    validations:
      required: true
  -
    type: "textarea"
    id: "spell"
    attributes:
      label: "Affected wand or spell"
      description: "Wand/spell ID, rank, input/keybind and optional mods. Enter N/A if this is unrelated to a spell."
    validations:
      required: true
  -
    type: "textarea"
    id: "logs"
    attributes:
      label: "Logs and screenshots"
      description: "Attach relevant logs or screenshots. Remove private information before uploading."
  -
    type: "textarea"
    id: "isolation"
    attributes:
      label: "Compatibility and additional context"
      description: "List relevant mods, integrations or configuration changes. Note whether a minimal setup reproduces the issue."
