plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.30.0-alpha'
group = 'nl.townsandkingdoms.resonantarcana'
base.archivesName = 'resonant-arcana'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
neoForge {
    version = '21.1.219'
    runs {
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
            gameDirectory = file('run')
            systemProperty 'resonant_arcana.integrationTest', System.getProperty('resonant_arcana.integrationTest', 'false')
        }
        client { client(); gameDirectory = file('run-client') }
    }
    mods { resonant_arcana { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar') { from('LICENSE'); from('AUDIO_CREDITS.md') }
// Copy tasks retain removed files; clear resource output before a changed resource set is copied.
tasks.named('processResources') { doFirst { delete destinationDir } }

// Verify equipment and the deliberately limited AAA asset set in the deliverable.
tasks.register('verifyPackagedAssets') {
    dependsOn tasks.named('jar')
    doLast {
        def jar = new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile)
        try {
            def paths = jar.entries().collect { it.name }
            ['ward_magic','ward_fire','doom_well_dark','explosion_seal'].each { id ->
                def entry = jar.getEntry('assets/resonant_arcana/effeks/'+id+'.efkefc')
                if (entry == null) throw new GradleException('Missing selective AAA effect '+id)
                if (new String(jar.getInputStream(entry).readNBytes(4), 'US-ASCII') != 'EFKE') throw new GradleException('Invalid AAA effect '+id)
            }
            ['explosion_charge','explosion_release','atomic_charge','atomic_release','cosmic_charge','cosmic_release','doom_laser_charge','doom_laser_release'].each { id ->
                def entry = jar.getEntry('assets/resonant_arcana/sounds/'+id+'.ogg')
                if (entry == null || new String(jar.getInputStream(entry).readNBytes(4), 'US-ASCII') != 'OggS') throw new GradleException('Missing or invalid recorded spell audio '+id)
            }
            if (paths.any { it.endsWith('/sounds/explosion_chant.ogg') || it.endsWith('/sounds/explosion_blast.ogg') }) throw new GradleException('Retired bass-boosted recording in JAR')
            def soundDefinitions = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getEntry('assets/resonant_arcana/sounds.json')))
            soundDefinitions.values().each { event -> event.sounds.each { sound ->
                def asset = 'assets/resonant_arcana/sounds/'+sound.name.split(':')[1]+'.ogg'
                if (!paths.contains(asset)) throw new GradleException('Unresolved sound resource '+asset)
            } }
            ['plasma_noise','fire_sphere'].each { id ->
                def entry = jar.getEntry('assets/resonant_arcana/textures/effect/'+id+'.png')
                if (entry == null) throw new GradleException('Missing original plasma asset '+id)
                def image = javax.imageio.ImageIO.read(jar.getInputStream(entry))
                if (image == null || image.width != 64 || image.height != 64) throw new GradleException('Invalid original plasma asset '+id)
            }
            ['data/resonant_arcana/dimension/void_exile.json','data/resonant_arcana/dimension_type/void_exile.json','data/resonant_arcana/tags/entity_type/exile_immune.json','assets/resonant_arcana/textures/gui/spell_icons/void_exile.png'].each { asset ->
                if (!paths.contains(asset)) throw new GradleException('Missing Void Exile asset '+asset)
            }
            def catalogue = new groovy.json.JsonSlurper().parse(jar.getInputStream(jar.getEntry('assets/resonant_arcana/catalogue.json')))
            catalogue.spells.values().each { spell ->
                if (!paths.contains('assets/resonant_arcana/textures/gui/spell_icons/'+spell.bookId+'.png')) throw new GradleException('Missing spell icon '+spell.bookId)
            }
            ['data/resonant_arcana/tags/irons_spellbooks/spells/all.json','data/resonant_arcana/tags/item/spellbooks.json'].each { asset ->
                if (!paths.contains(asset)) throw new GradleException('Missing searchable tag '+asset)
            }
            ['sigil','star','flame','glow','halo','shard'].each { id ->
                if (!paths.contains('assets/resonant_arcana/effeks/textures/'+id+'.png')) throw new GradleException('Missing AAA texture '+id)
            }
            if (paths.count { it.endsWith('.efkefc') } != 4) throw new GradleException('Only four selective AAA effects are allowed')
            ['debug_wand','runic_echoes_spell_book','phoenix_spell_book','deathchill_spell_book'].each { id ->
                ['models/item/'+id+'.json','textures/item/'+id+'.png'].each { asset ->
                    if (!paths.contains('assets/resonant_arcana/'+asset)) throw new GradleException('Missing '+asset)
                }
            }
            if (paths.any { it.endsWith('_wand.png') && !it.endsWith('debug_wand.png') }) throw new GradleException('Retired wand textures in JAR')
            logger.lifecycle('Verified item assets, four selective AAA effects and absence of retired wand textures.')
        } finally { jar.close() }
    }
}
tasks.named('check') { dependsOn 'verifyPackagedAssets' }

repositories { maven { url = 'https://code.redspace.io/releases' } }
dependencies {
    // A local copy may be supplied for offline development; the API is never bundled.
    if (providers.gradleProperty('ironsSpellbooksJar').isPresent()) {
        compileOnly files(providers.gradleProperty('ironsSpellbooksJar').get())
    } else {
        compileOnly('io.redspace:irons_spellbooks:1.21.1-3.16.3') { transitive = false }
    }
}

// Optional at runtime; supplied API JARs are needed only to compile the isolated adapter.
dependencies {
    compileOnly files(providers.gradleProperty('bossesRiseJar').orElse('libs/bossesrise-2.1.2.jar').get())
    compileOnly files(providers.gradleProperty('curiosJar').orElse('libs/curios-neoforge-9.5.1+1.21.1.jar').get())
    compileOnly files(providers.gradleProperty('geckolibJar').orElse('libs/geckolib-4.8.2.jar').get())
}

// A crashed test server must never leave a previous success report usable as evidence.
tasks.named('runServer') {
    doFirst { if (System.getProperty('resonant_arcana.integrationTest') == 'true') delete file('validation/server-integration.json') }
    doLast {
        if (System.getProperty('resonant_arcana.integrationTest') == 'true') {
            def report = file('validation/server-integration.json')
            if (!report.isFile()) throw new GradleException('Integration server produced no fresh report')
            def result = new groovy.json.JsonSlurper().parse(report)
            if (!result.success) throw new GradleException('Integration failed: '+result.error)
            logger.lifecycle('Fresh integration report: '+result.checksPassed+' checks passed.')
        }
    }
}

// Optional Alex's Caves API: never included in the addon JAR.
dependencies {
    compileOnly files(providers.gradleProperty("alexsCavesJar").orElse("libs/alexscaves-2.0.10.jar").get())
    compileOnly files(providers.gradleProperty("citadelJar").orElse("libs/citadel.jar").get())
}
