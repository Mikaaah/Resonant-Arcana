plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.17.0-alpha'
group = 'nl.townsandkingdoms.resonantarcana'
base.archivesName = 'resonant-arcana'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
neoForge {
    version = '21.1.219'
    runs {
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
            gameDirectory = file('run')
            systemProperty 'resonant_arcana.integrationTest', System.getProperty('resonant_arcana.integrationTest', 'false')
        }
        client { client(); gameDirectory = file('run-client') }
    }
    mods { resonant_arcana { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar') { from('LICENSE') }
// Copy tasks retain removed files; clear resource output before a changed resource set is copied.
tasks.named('processResources') { doFirst { delete destinationDir } }

// Validate the paths consumed by Minecraft, rather than resolving them on the build machine.
tasks.register('verifyEffects') {
    def effects = file('src/main/resources/assets/resonant_arcana/effeks')
    inputs.dir(effects)
    doLast {
        def assets = fileTree(effects).matching { include '*.efkefc' }.files
        def manifest = new groovy.json.JsonSlurper().parse(new File(effects, 'manifest.json')).effects as Set
        if ((assets.collect { it.name } as Set) != manifest) throw new GradleException('Packaged effects do not match manifest.json')
        assets.each { asset ->
            def buffer = java.nio.ByteBuffer.wrap(asset.bytes).order(java.nio.ByteOrder.LITTLE_ENDIAN)
            if (buffer.remaining() < 8 || buffer.getInt() != 0x454b4645) throw new GradleException("Invalid effect container: ${asset.name}")
            buffer.getInt()
            boolean found = false
            while (buffer.remaining() >= 8) {
                int type = buffer.getInt(), length = buffer.getInt()
                if (length < 0 || length > buffer.remaining()) throw new GradleException("Invalid chunk: ${asset.name}")
                int end = buffer.position() + length
                if (type == 0x5f4e4942) {
                    found = true
                    def nativeData = buffer.slice().order(java.nio.ByteOrder.LITTLE_ENDIAN)
                    nativeData.limit(length)
                    if (nativeData.remaining() < 12 || nativeData.getInt() != 0x45464b53) throw new GradleException("Invalid native effect: ${asset.name}")
                    nativeData.getInt()
                    int count = nativeData.getInt()
                    if (count < 1 || count > 8) throw new GradleException("Unexpected texture table: ${asset.name}")
                    count.times {
                        int chars = nativeData.getInt()
                        if (chars < 2 || chars > 1024 || chars * 2 > nativeData.remaining()) throw new GradleException("Invalid texture path: ${asset.name}")
                        byte[] encoded = new byte[chars * 2]
                        nativeData.get(encoded)
                        String path = new String(encoded, 'UTF-16LE').replace('\u0000', '')
                        if (!(path ==~ /textures\/[a-z0-9_]+\.png/)) throw new GradleException("Nonportable texture path in ${asset.name}: ${path}")
                        if ((asset.name.startsWith('cast_') || asset.name.startsWith('charge_') || asset.name.contains('_charge_')) && path == 'textures/sigil.png') {
                        throw new GradleException("Camera-facing casting effect must not contain a sigil: ${asset.name}")
                    }
                    def texture = new File(effects, path)
                        if (!texture.isFile()) throw new GradleException("Missing texture in ${asset.name}: ${path}")
                    }
                }
                buffer.position(end)
            }
            if (!found) throw new GradleException("Native effect chunk missing: ${asset.name}")
        }
        logger.lifecycle("Verified all ${assets.size()} effects use packaged Minecraft texture paths.")
    }
}
tasks.named('check') { dependsOn 'verifyEffects' }

tasks.register('verifyPackagedEffects') {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    inputs.file('src/main/resources/assets/resonant_arcana/effeks/manifest.json')
    doLast {
        def expected = new groovy.json.JsonSlurper().parse(file('src/main/resources/assets/resonant_arcana/effeks/manifest.json')).effects as Set
        def packaged = zipTree(tasks.named('jar').get().archiveFile.get().asFile).matching {
            include 'assets/resonant_arcana/effeks/*.efkefc'
        }.files.collect { it.name } as Set
        if (packaged != expected) throw new GradleException('JAR contains missing or stale particle effects')
        logger.lifecycle("Verified packaged JAR contains exactly ${packaged.size()} particle effects.")
    }
}
tasks.named('check') { dependsOn 'verifyPackagedEffects' }

repositories { maven { url = 'https://code.redspace.io/releases' } }
dependencies {
    // A local copy may be supplied for offline development; the API is never bundled.
    if (providers.gradleProperty('ironsSpellbooksJar').isPresent()) {
        compileOnly files(providers.gradleProperty('ironsSpellbooksJar').get())
    } else {
        compileOnly('io.redspace:irons_spellbooks:1.21.1-3.16.3') { transitive = false }
    }
}

// Optional at runtime; supplied API JARs are needed only to compile the isolated adapter.
dependencies {
    compileOnly files(providers.gradleProperty('bossesRiseJar').orElse('libs/bossesrise-2.1.2.jar').get())
    compileOnly files(providers.gradleProperty('geckolibJar').orElse('libs/geckolib-4.8.2.jar').get())
}
