plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '0.21.0-alpha'
group = 'nl.townsandkingdoms.resonantarcana'
base.archivesName = 'resonant-arcana'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()
neoForge {
    version = '21.1.219'
    runs {
        server {
            server()
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
            gameDirectory = file('run')
            systemProperty 'resonant_arcana.integrationTest', System.getProperty('resonant_arcana.integrationTest', 'false')
        }
        client { client(); gameDirectory = file('run-client') }
    }
    mods { resonant_arcana { sourceSet sourceSets.main } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar') { from('LICENSE') }
// Copy tasks retain removed files; clear resource output before a changed resource set is copied.
tasks.named('processResources') { doFirst { delete destinationDir } }

// Validate native assets and reject removed renderer content in the deliverable.
tasks.register('verifyPackagedAssets') {
    dependsOn tasks.named('jar')
    doLast {
        def jar = new java.util.zip.ZipFile(tasks.named('jar').get().archiveFile.get().asFile)
        try {
            def paths = jar.entries().collect { it.name }
            if (paths.any { it.contains('/effeks/') || it.endsWith('AaaEffects.class') }) throw new GradleException('Retired AAA content in JAR')
            ['debug_wand','runic_echoes_spell_book','phoenix_spell_book','deathchill_spell_book'].each { id ->
                ['models/item/'+id+'.json','textures/item/'+id+'.png'].each { asset ->
                    if (!paths.contains('assets/resonant_arcana/'+asset)) throw new GradleException('Missing '+asset)
                }
            }
            if (paths.any { it.endsWith('_wand.png') && !it.endsWith('debug_wand.png') }) throw new GradleException('Retired wand textures in JAR')
            logger.lifecycle('Verified four item assets and absence of retired AAA/wand content.')
        } finally { jar.close() }
    }
}
tasks.named('check') { dependsOn 'verifyPackagedAssets' }

repositories { maven { url = 'https://code.redspace.io/releases' } }
dependencies {
    // A local copy may be supplied for offline development; the API is never bundled.
    if (providers.gradleProperty('ironsSpellbooksJar').isPresent()) {
        compileOnly files(providers.gradleProperty('ironsSpellbooksJar').get())
    } else {
        compileOnly('io.redspace:irons_spellbooks:1.21.1-3.16.3') { transitive = false }
    }
}

// Optional at runtime; supplied API JARs are needed only to compile the isolated adapter.
dependencies {
    compileOnly files(providers.gradleProperty('bossesRiseJar').orElse('libs/bossesrise-2.1.2.jar').get())
    compileOnly files(providers.gradleProperty('curiosJar').orElse('libs/curios-neoforge-9.5.1+1.21.1.jar').get())
    compileOnly files(providers.gradleProperty('geckolibJar').orElse('libs/geckolib-4.8.2.jar').get())
}

// A crashed test server must never leave a previous success report usable as evidence.
tasks.named('runServer') {
    doFirst { if (System.getProperty('resonant_arcana.integrationTest') == 'true') delete file('validation/server-integration.json') }
    doLast {
        if (System.getProperty('resonant_arcana.integrationTest') == 'true') {
            def report = file('validation/server-integration.json')
            if (!report.isFile()) throw new GradleException('Integration server produced no fresh report')
            def result = new groovy.json.JsonSlurper().parse(report)
            if (!result.success) throw new GradleException('Integration failed: '+result.error)
            logger.lifecycle('Fresh integration report: '+result.checksPassed+' checks passed.')
        }
    }
}
